<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dear M5! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: slideUp 1s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cake {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .name {
            color: #e84393;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.1), 0 0 20px #ff6b6b; }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.1), 0 0 30px #ff9ff3; }
        }

        .message {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #2d3436;
            margin: 30px 0;
            font-weight: 300;
        }

        .heart {
            font-size: 2rem;
            color: #e17055;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        .wish-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            font-weight: bold;
        }

        .wish-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
        }

        .wish-btn:active {
            transform: translateY(-2px);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .name {
                font-size: 2.5rem;
            }
            
            .cake {
                font-size: 3rem;
            }
            
            .message {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2rem;
            }
            
            .cake {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="confetti-canvas"></div>
    
    <div class="container">
        <div class="cake">🎂✨</div>
        <h1>Happy Birthday <span class="name">M5</span>! 🎉</h1>
        
        <p class="message">
            On this special day, I want you to know how much you mean to me. 
            <br><br>
            Your smile lights up my world, your laughter is my favorite song, 
            <br>
            and your presence makes every moment magical. 
            <br><br>
            <span class="heart">💖</span> Here's to celebrating YOU – the most amazing person I know! <span class="heart">💖</span>
        </p>
        
        <button class="wish-btn" onclick="launchConfetti()">Make a Wish! ✨</button>
        <button class="wish-btn" onclick="shareJoy()">Share the Joy! 🎈</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Auto confetti on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                launchConfetti();
            }, 1000);
        });

        function launchConfetti() {
            // Multiple confetti bursts
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            confetti({
                particleCount: 100,
                angle: 60,
                spread: 55,
                origin: { x: 0 }
            });
            
            confetti({
                particleCount: 100,
                angle: 120,
                spread: 55,
                origin: { x: 1 }
            });

            // Continuous light confetti
            setTimeout(() => {
                for(let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        confetti({
                            particleCount: 20,
                            spread: 30,
                            origin: { y: 0.7 }
                        });
                    }, i * 200);
                }
            }, 500);
        }

        function shareJoy() {
            // Vibrant confetti explosion
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'];
            
            for(let i = 0; i < 10; i++) {
                setTimeout(() => {
                    confetti({
                        particleCount: 50,
                        angle: 60 + i * 3,
                        spread: 55,
                        origin: { x: Math.random() },
                        colors: [colors[i % colors.length]]
                    });
                }, i * 100);
            }
            
            // Show share message
            alert('🎉 Happy Birthday M5! Share this joy with everyone! 🥳');
        }

        // Add floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = '20px';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '5';
            heart.style.animation = 'floatUp 3s ease-out forwards';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        // Add floating hearts CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                to {
                    transform: translateY(-100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Create hearts periodically
        setInterval(createHeart, 2000);

        // Responsive touch events for mobile
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            
            if (Math.abs(diff) > 50) {
                launchConfetti();
            }
        });
    </script>
</body>
</html>
